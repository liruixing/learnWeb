services:
  mysql:
    image: mysql:8.4
    container_name: learn-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: blog_mvp
    ports:
      - "3306:3306"
    volumes:
      - learn-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  learn-mysql-data:
